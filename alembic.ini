[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; A URL real vem de app.config.get_settings() em alembic/env.py — este valor
; aqui é apenas um placeholder, nunca usado em runtime.
sqlalchemy.url = postgresql+psycopg://pedidos:pedidos@localhost:5432/pedidos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
